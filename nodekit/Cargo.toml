[package]
name = "nodekit"
version = "0.1.0"
description = "A TUI for managing Algorand Nodes"
authors = ["Michael J Feher <michael.feher@algorand.foundation>"]
license = "MIT"
edition = "2024"

[dependencies]
futures = "0.3.31"
color-eyre = "0.6.3"
clap = { version = "4.5.4", features = ["derive", "env"] }
url = "2.5"
qrcode = "0.12.0"
base64 = "0.22.1"
chrono = "0.4.39"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
algokit_transact = { git = "https://github.com/phearzero/algokit-core.git", version = "0.1.0", branch = "feat/wasm32" }
algod_client = { git = "https://github.com/phearzero/algokit-core.git", version = "0.0.1", branch = "feat/wasm32" }
algokit_http_client = { git = "https://github.com/phearzero/algokit-core.git", version = "0.1.0", features = ["default_client"], branch = "feat/wasm32" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.40.0", features = ["full"] }
ratatui = { version = "0.30.0", features = ["crossterm"] }
reqwest = { version = "0.12.12", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.40.0", features = ["sync", "macros", "rt", "time"] }
ratatui = { version = "0.30.0", default-features = false }
ratzilla = { version = "0.3.0", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
uuid = { version = "1.13.1", features = ["v4", "js"] }
async-trait = "0.1"
reqwest = { version = "0.12.12", default-features = false, features = ["json"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
