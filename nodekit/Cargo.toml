[package]
name = "nodekit"
version = "0.1.0"
description = "A TUI for managing Algorand Nodes"
authors = ["Michael J Feher <michael.feher@algorand.foundation>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
color-eyre = "0.6.3"
clap = { version = "4.5.4", features = ["derive", "env"] }
algokit_transact = { git = "https://github.com/algorandecosystem/algokit-core.git", version = "0.1.0" }
algod_client = { git = "https://github.com/algorandecosystem/algokit-core.git", version = "0.0.1" }
algokit_http_client = { git = "https://github.com/algorandecosystem/algokit-core.git", version = "0.1.0", features = ["default_client"] }
url = "2.5"
qrcode = "0.12.0"
base64 = "0.22.1"
chrono = "0.4.39"
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratzilla = "0.3.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
